<title>体感と実測の層</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1c222a; --ink:#eef2f6; --ink2:#b7c1cc; --quiet:#7d8894; --line:#2a323c; --edge:#333c47;
  --felt:#c9a24b; --measured:#4bb3a6; --pos:#4bb37a; --neg:#d3695a; --warn:#c98a3a;
  --sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
}
:root[data-theme="light"]{ --bg:#f3f5f7; --panel:#ffffff; --panel2:#f0f3f6; --ink:#161a1e; --ink2:#3d454e; --quiet:#67707a;
  --line:#e2e6ea; --edge:#d5dae0; --felt:#9a7614; --measured:#1c7d72; --pos:#1f8a52; --neg:#b23e2e; --warn:#9a6a1a; --shadow:0 1px 2px rgba(20,20,25,.06),0 10px 26px rgba(20,20,25,.09);}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){ --bg:#f3f5f7; --panel:#ffffff; --panel2:#f0f3f6; --ink:#161a1e; --ink2:#3d454e; --quiet:#67707a;
  --line:#e2e6ea; --edge:#d5dae0; --felt:#9a7614; --measured:#1c7d72; --pos:#1f8a52; --neg:#b23e2e; --warn:#9a6a1a; --shadow:0 1px 2px rgba(20,20,25,.06),0 10px 26px rgba(20,20,25,.09);}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
.wrap{max-inline-size:min(880px,95vw);margin-inline:auto;padding:clamp(1rem,3vw,2rem)}
.top{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:baseline;justify-content:space-between;border-block-end:1px solid var(--line);padding-block-end:.7rem}
h1{font-size:clamp(1.05rem,2.8vw,1.4rem);margin:0}
.top .anchor{font-size:.76rem;color:var(--quiet)}
.lede{font-size:.92rem;color:var(--ink2);margin:.9rem 0 1rem;max-inline-size:64ch}
.toggle{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;margin-block:.3rem 1.2rem}
.toggle button{font:inherit;font-weight:600;font-size:.9rem;padding:.5rem 1.1rem;min-block-size:2.75rem;background:var(--panel);color:var(--ink2);border:0;cursor:pointer}
.toggle button[aria-pressed="true"]{color:var(--bg)}
.toggle button.f[aria-pressed="true"]{background:var(--felt);color:#1a1400}
.toggle button.m[aria-pressed="true"]{background:var(--measured);color:#04201d}
.layers{display:grid;gap:.8rem}
.sig{background:var(--panel);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);padding:.85rem 1rem;
  display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center;transition:opacity .25s,border-color .25s}
.sig .what{font-weight:600;font-size:.98rem;grid-column:1}
.sig .num{grid-column:2;grid-row:1 / span 2;font-family:var(--mono);font-weight:700;font-size:1.5rem;text-align:end}
.sig .meta{grid-column:1;font-size:.78rem;color:var(--quiet);display:flex;flex-wrap:wrap;gap:.35rem .7rem;align-items:center}
.kind{font-family:var(--mono);font-size:.68rem;font-weight:700;padding:.05rem .4rem;border-radius:4px;border:1px solid currentColor}
.k-felt{color:var(--felt)} .k-measured{color:var(--measured)} .k-inf{color:var(--warn)}
.num.pos{color:var(--pos)} .num.neg{color:var(--neg)} .num.mix{color:var(--warn)}
a.src{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--quiet)}
a.src:hover{text-decoration-color:var(--ink)}
.ev{font-size:.72rem;color:var(--quiet)}
/* 強調モード: 該当層を前に、他層を沈める */
body[data-view="felt"] .sig.measured{opacity:.28;filter:saturate(.5)}
body[data-view="measured"] .sig.felt{opacity:.28;filter:saturate(.5)}
.sig.felt{border-inline-start:4px solid var(--felt)} .sig.measured{border-inline-start:4px solid var(--measured)}
.gap{margin-block-start:1.3rem;background:var(--panel2);border:1px dashed var(--warn);border-radius:12px;padding:.9rem 1rem;font-size:.92rem}
.gap b{color:var(--warn)}
.hint{font-size:.78rem;color:var(--quiet);margin-block-start:1rem}
:focus-visible{outline:3px solid var(--measured);outline-offset:2px}
@media (max-width:560px){ .sig .num{font-size:1.25rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header class="top"><h1 id="title"></h1><span class="anchor" id="anchor"></span></header>
  <p class="lede">同じ話題に、<b style="color:var(--felt)">体感</b>の層と<b style="color:var(--measured)">実測</b>の層があります。
  体感はほぼ一様に「速い・良い」ですが、実測は条件で符号が変わります。切り替えて、そのズレを見てください。</p>
  <div class="toggle" role="group" aria-label="表示する層">
    <button class="f" id="bf" aria-pressed="true">体感の層</button>
    <button class="m" id="bm" aria-pressed="false">実測の層</button>
  </div>
  <div class="layers" id="layers"></div>
  <div class="gap" id="gap"></div>
  <p class="hint">数字の大きさは「重要さ」ではありません。各行の <span class="kind k-measured">measured</span> /
  <span class="kind k-felt">felt</span> / <span class="kind k-inf">inference</span> と evidence、source を見てください。</p>
</div>
<script>
const DATA=__FIXTURE__; const $=s=>document.querySelector(s);
$('#title').textContent=DATA.topic; $('#anchor').textContent='あなたの関心: '+DATA.owner_known_interest;
const S=id=>DATA.items.find(i=>i.id===id);
const srcLink=(arr)=>`<a class="src" href="${arr[0]}" target="_blank" rel="noopener">source ↗</a>`;
// 体感 / 実測 の信号（すべて material の実値に基づく）
const signals=[
  {layer:'felt', what:'速くなったと“感じる”（体験後）', num:'+20%', sign:'pos', kind:'felt', ev:'METR: 実測は逆でも体感は +20%', src:S('metr_rct').source},
  {layer:'felt', what:'生産性が上がったと実感', num:'75%', sign:'pos', kind:'felt', ev:'DORA 2024 の回答者', src:S('dora_survey').source},
  {layer:'measured', what:'熟練×既知 repo での所要時間', num:'−19%', sign:'neg', kind:'measured', ev:'METR RCT（遅い）', src:S('metr_rct').source},
  {layer:'measured', what:'greenfield・単純タスクの所要時間', num:'+55.8%', sign:'pos', kind:'measured', ev:'Copilot RCT（速い・単一課題）', src:S('copilot_rct').source},
  {layer:'measured', what:'配信の安定性（AI採用+25%時）', num:'−7.2%', sign:'neg', kind:'measured', ev:'DORA 2024（モデル推定・相関）', src:S('dora_survey').source},
];
const box=$('#layers');
signals.forEach(s=>{ const d=document.createElement('div'); d.className='sig '+s.layer;
  d.innerHTML=`<div class="what">${s.what}</div><div class="num ${s.sign==='pos'?'pos':s.sign==='neg'?'neg':'mix'}">${s.num}</div>`+
    `<div class="meta"><span class="kind k-${s.kind==='felt'?'felt':'measured'}">${s.kind}</span><span class="ev">${s.ev}</span>${srcLink(s.src)}</div>`;
  box.append(d); });
$('#gap').innerHTML=`<b>ズレ</b>: 体感は一様に＋（+20%・75%）。実測は<b>条件で符号が変わる</b>（既知repoで−19%、greenfieldで+55.8%、安定性−7.2%）。`+
  `<br>つまり「速く感じた」は<b>それ自体が測定値</b>で、実測の代わりにはなりません。<span class="kind k-inf">inference</span> ${DATA.reconciling_hypotheses.find(h=>h.id==='reconcile_perception').content}`;
function view(v){ document.body.dataset.view=v; $('#bf').setAttribute('aria-pressed', v==='felt'); $('#bm').setAttribute('aria-pressed', v==='measured'); }
$('#bf').onclick=()=>view('felt'); $('#bm').onclick=()=>view('measured'); view('felt');
</script>
