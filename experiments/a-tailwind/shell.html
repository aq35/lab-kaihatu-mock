<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Owner Control Center (A: Tailwind)</title>
<link rel="stylesheet" href="{{BASE}}dist/tailwind.css">
</head>
<body>
<a class="absolute start-2 top-2 z-10 -translate-y-[200%] rounded-md border-2 border-blue-700 bg-white px-4 py-2 focus:translate-y-0" href="#main">本文へ移動</a>
<div class="mx-auto max-w-7xl px-4 py-8">
  <header class="mb-8">
    <h1 class="mb-2 text-3xl font-bold text-slate-900 dark:text-slate-100">Owner Control Center</h1>
    <p>KAS があなたの判断を必要としている項目です。対応が必要: <strong data-attention-count>—</strong> 件</p>
    <form class="mt-4 flex flex-wrap gap-4" method="get" action="">
      <p class="grid gap-0.5"><label for="type-filter" class="text-xs font-semibold text-slate-500">種別で絞り込む</label>
        <select id="type-filter" name="type" data-type-filter class="min-h-11 rounded-md border border-slate-400 bg-white px-2 dark:border-slate-500 dark:bg-slate-800">
          <option value="ALL">すべて</option><option value="OWNER_QUESTION">質問</option>
          <option value="ACTION_APPROVAL">承認</option><option value="OUTCOME_UNKNOWN_REVIEW">結果不明</option>
          <option value="RESULT_REVIEW">結果</option><option value="INFORMATION">お知らせ</option>
        </select></p>
      <noscript><button type="submit">適用</button></noscript>
    </form>
    <p class="sr-only" role="status" aria-live="polite" data-filter-status></p>
  </header>
  <main id="main">
    <h2 class="sr-only">対応が必要な項目</h2>
    {{CARDS}}
  </main>
</div>
<script type="module" src="{{BASE}}scripts/boot.js"></script>
</body>
</html>
