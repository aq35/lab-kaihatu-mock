<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Owner Control Center (E: Compiler)</title>
<!-- CSS は AI が書いていない。recipe.default.json から Compiler が生成した 1 本 -->
<link rel="stylesheet" href="{{BASE}}styles/generated.css">
</head>
<body>
<a class="kskip" href="#main">本文へ移動</a>
<div class="kpage">
  <header>
    <h1>Owner Control Center</h1>
    <p>KAS があなたの判断を必要としている項目です。対応が必要: <strong data-attention-count>—</strong> 件</p>
    <p class="kvh" role="status" aria-live="polite" data-filter-status></p>
    <form method="get" action="">
      <p class="kcontrol"><label for="type-filter">種別で絞り込む</label>
        <select id="type-filter" name="type" data-type-filter>
          <option value="ALL">すべて</option><option value="OWNER_QUESTION">質問</option>
          <option value="ACTION_APPROVAL">承認</option><option value="OUTCOME_UNKNOWN_REVIEW">結果不明</option>
          <option value="RESULT_REVIEW">結果</option><option value="INFORMATION">お知らせ</option>
        </select></p>
      <noscript><button type="submit">適用</button></noscript>
    </form>
  </header>
  <main id="main">
    <h2 class="kvh">対応が必要な項目</h2>
    {{CARDS}}
  </main>
</div>
<script type="module" src="{{BASE}}scripts/boot.js"></script>
</body>
</html>
