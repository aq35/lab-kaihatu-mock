<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Owner Control Center (E: Compiler)</title>
<!-- CSS は AI が書いていない。recipe.default.json から Compiler が生成した 1 本 -->
<link rel="stylesheet" href="{{BASE}}styles/generated.css">
</head>
<body>
<a class="kskip" href="#main">本文へ移動</a>
<div class="kpage">
  <header>
    <h1>Owner Control Center</h1>
    <p>KAS があなたの判断を必要としている項目です。対応が必要: <strong data-attention-count>—</strong> 件</p>
    <form method="get" action=""><p class="kvh" role="status" aria-live="polite" data-filter-status></p></form>
  </header>
  <main id="main">
    <h2 class="kvh">対応が必要な項目</h2>
    {{CARDS}}
  </main>
</div>
<script type="module">
  import { enhanceDecisionForms } from '{{BASE}}scripts/forms.js';
  const main = document.querySelector('#main');
  const dispose = enhanceDecisionForms(main);
  const counter = document.querySelector('[data-attention-count]');
  if (counter) counter.textContent = String(main.querySelectorAll(
    '[data-card-type="OWNER_QUESTION"][data-card-state="LIVE"],[data-card-type="ACTION_APPROVAL"][data-card-state="LIVE"],[data-card-type="OUTCOME_UNKNOWN_REVIEW"][data-card-state="LIVE"]').length);
  window.addEventListener('pagehide', () => dispose(), { once: true });
</script>
</body>
</html>
