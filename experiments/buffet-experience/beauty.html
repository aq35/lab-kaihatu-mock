<title>料理の美から始める</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;700&family=Shippori+Mincho:wght@400;500&display=swap">
<style>
:root{
  --bg:#120d0c; --bg2:#1b1412; --ink:#f6ede2; --ink2:#d6c6b4; --quiet:#a2917d; --edge:#3a2c25;
  --rose:#d06a60; --wine:#7c2f30; --gold:#cd9f57;
  --mincho:"Zen Old Mincho","Hiragino Mincho ProN",serif;
  --body:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;
  --sans:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.9;-webkit-font-smoothing:antialiased;letter-spacing:.02em}
.wrap{max-inline-size:min(720px,100%);margin-inline:auto;padding-inline:clamp(1.2rem,5vw,2.4rem)}
/* hero with organic curved mask */
.hero{position:relative;inline-size:100%;block-size:min(78vh,620px);overflow:hidden;background:#0b0908}
.hero img{inline-size:100%;block-size:100%;object-fit:cover;display:block;filter:saturate(1.06) contrast(1.03)}
.hero .veil{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 20%,rgba(11,8,7,0) 40%,rgba(11,8,7,.5) 100%),linear-gradient(180deg,rgba(11,8,7,.2),rgba(11,8,7,0) 34%,rgba(11,8,7,0) 55%,var(--bg) 99%)}
.hero .mask{position:absolute;inset-inline:0;inset-block-end:-1px;inline-size:100%;height:90px;display:block}
.hero .cap{position:absolute;inset-inline:0;inset-block-end:2.6rem;max-inline-size:720px;margin-inline:auto;padding-inline:clamp(1.2rem,5vw,2.4rem)}
.hero .over{font-family:var(--sans);font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:0 0 .9rem;padding-inline-start:.3em}
.hero h1{font-family:var(--mincho);font-weight:500;font-size:clamp(2rem,7.5vw,3.4rem);line-height:1.28;margin:0;text-wrap:balance;color:#fff;text-shadow:0 3px 30px rgba(0,0,0,.55);letter-spacing:.04em}
.lede{font-family:var(--mincho);font-weight:400;font-size:clamp(1.25rem,3.6vw,1.7rem);line-height:1.85;color:var(--ink);margin:2.4rem 0 1.4rem;text-wrap:balance}
.prose{font-size:clamp(1.02rem,2.6vw,1.15rem);color:var(--ink2);margin:1rem 0}
.prose .em{color:var(--ink);border-block-end:1px solid color-mix(in oklab,var(--rose),transparent 55%);padding-block-end:1px}
/* organic divider */
.orn{display:block;margin:2.8rem auto;inline-size:120px;height:26px;color:var(--gold);opacity:.85}
/* venue */
.turn{font-family:var(--sans);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin:0 0 .7rem;text-align:center}
.venue{background:linear-gradient(180deg,var(--bg2),#160f0d);border:1px solid var(--edge);border-radius:28px;padding:clamp(1.3rem,4vw,2rem);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.venue h2{font-family:var(--mincho);font-weight:500;font-size:clamp(1.35rem,4vw,1.7rem);margin:0 0 .2rem;color:var(--ink);letter-spacing:.03em}
.venue .sub{font-family:var(--sans);font-size:.82rem;color:var(--quiet);line-height:1.7}
.dishes{display:flex;flex-wrap:wrap;gap:.5rem;margin-block:1.2rem}
.dishes span{font-family:var(--sans);font-size:.9rem;border:1px solid var(--edge);border-radius:999px;padding:.4rem .95rem;color:var(--ink2);background:radial-gradient(120% 140% at 30% 20%,#ffffff0a,transparent)}
.line{display:flex;gap:.8rem;flex-wrap:wrap;font-family:var(--sans);font-size:.92rem;color:var(--ink2);padding-block:.55rem;border-block-start:1px solid #ffffff10}
.line b{min-inline-size:4.5rem;color:var(--ink);font-weight:600}
.map{margin-block-start:1.1rem;border-radius:20px;overflow:hidden;border:1px solid var(--edge)}
.map svg{display:block;inline-size:100%;height:auto}
a{color:var(--gold);text-underline-offset:3px} a:hover{color:#e6c98a}
.decide{margin:3rem 0 1rem} .choices{display:flex;flex-wrap:wrap;gap:.6rem}
.choices button{font-family:var(--sans);font-size:.94rem;padding:.7rem 1.15rem;min-block-size:3rem;border-radius:999px;cursor:pointer;border:1px solid var(--edge);background:var(--bg2);color:var(--ink);transition:border-color .2s,background .2s}
.choices button[aria-pressed="true"]{border-color:var(--rose);background:radial-gradient(120% 160% at 30% 10%,color-mix(in oklab,var(--rose),transparent 70%),color-mix(in oklab,var(--wine),transparent 55%));color:#fff;font-weight:700}
.reason{margin-block-start:1rem;font-size:.98rem;color:var(--ink2);font-family:var(--body);min-block-size:1.6rem}
.foot{color:var(--quiet);font-family:var(--sans);font-size:.72rem;line-height:1.7;padding:2.4rem 0 3.4rem;opacity:.7}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="hero">
  <img src="__IMG__" alt="スライスされたローストビーフ。断面はロゼ色。黒胡椒とハーブ、照りのあるソース、付け合わせのトレビス。">
  <div class="veil"></div>
  <svg class="mask" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0,90 L0,46 C240,86 480,20 720,34 C960,48 1200,92 1440,40 L1440,90 Z" fill="var(--bg)"/></svg>
  <div class="cap">
    <p class="over">料理の美</p>
    <h1>切った断面は、<br>ロゼ色だった。</h1>
  </div>
</div>

<div class="wrap">
  <p class="lede">数字の前に、一皿の姿がある。</p>
  <p class="prose">中心まで火を入れすぎない、<span class="em">ロゼ色の断面</span>。細かなサシが、光を淡くふくむ。
  粗挽きの黒胡椒、<span class="em">照りのあるソース</span>のひとすじ。薄く切って、幾重にも重ねる。
  傍らに、赤紫のトレビスがひとひら。</p>

  <svg class="orn" viewBox="0 0 120 26" aria-hidden="true"><path d="M2,13 C30,2 44,24 60,13 C76,2 90,24 118,13" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="60" cy="13" r="2.4" fill="currentColor"/></svg>

  <p class="turn">その味わいを、目の前で</p>
  <div class="venue">
    <h2 id="venue"></h2>
    <div class="sub" id="plan"></div>
    <div class="dishes" id="dishes"></div>
    <div class="line" id="l-time"></div>
    <div class="line" id="l-price"></div>
    <div class="map" aria-label="おおよその位置">
      <svg viewBox="0 0 720 150" role="img" aria-label="竹芝・浜松町エリアの簡易位置図">
        <rect x="0" y="0" width="720" height="150" fill="#100b0a"></rect>
        <path d="M0,104 C160,120 320,96 480,108 C600,116 660,100 720,110 L720,150 L0,150 Z" fill="#1c1512"></path>
        <text x="16" y="96" font-size="11" fill="#8f7f6d" font-family="sans-serif">東京湾・竹芝ふ頭</text>
        <circle cx="330" cy="66" r="6.5" fill="#d06a60"></circle>
        <circle cx="330" cy="66" r="13" fill="none" stroke="#d06a60" stroke-opacity=".4"></circle>
        <text x="352" y="70" font-size="13" fill="#f6ede2" font-family="sans-serif">インターコンチネンタル東京ベイ</text>
      </svg>
    </div>
    <p style="font-family:var(--sans);font-size:.82rem;color:var(--quiet);margin-block-start:1rem"><a id="off" target="_blank" rel="noopener">場所・アクセス・最新情報を公式で見る ↗</a></p>
  </div>

  <div class="decide">
    <p class="turn" style="text-align:start">あなたはどう感じましたか</p>
    <div class="choices" id="choices"></div>
    <div class="reason" id="reason">見て、行ってみたいと思ったか。</div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
const M=__FIXTURE__; const $=s=>document.querySelector(s);
$('#venue').textContent=M.identity.venue.split('（')[0];
$('#plan').textContent=M.identity.plan_name+'　開催 '+M.identity.period.split('（')[0];
const dishes=[...M.dishes.weekday_only,...M.dishes.dinner_only,...M.dishes.lunch_only,...M.dishes.always];
$('#dishes').innerHTML=dishes.map(d=>`<span>${d.replace(/（.*?）/,'')}</span>`).join('');
$('#l-time').innerHTML=`<b>時間</b><span>ランチ ${M.hours.lunch}　／　ディナー 日〜金 ${M.hours.dinner_sun_fri}・土 ${M.hours.dinner_sat}</span>`;
$('#l-price').innerHTML=`<b>料金</b><span>ランチ 平日 約¥5,400・休日 約¥6,000（ディナーは別料金・要確認）</span>`;
$('#off').href=M.identity.official_page;
$('#foot').textContent='写真: ローストビーフ（Wikimedia Commons／許可のもと使用）。料理イメージです。料金・空席・当日の提供内容は公式でご確認ください。研究用の画面で、予約・購入はしません。';
let cur=null; const decs=[['go','行ってみたい'],['curious','気になる'],['no','今回は行かない'],['unsure','まだ判断できない']];
const cb=$('#choices');
decs.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed','false');
  b.onclick=()=>{cur=v;[...cb.children].forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');
    $('#reason').textContent=v==='no'?'納得の上での「行かない」も、ひとつの答えです。':(v==='go'?'その気持ちが、この画面のねらいでした。詳しくは公式で。':'気になったら、公式で日取りと料金を。');
  };cb.append(b);});
</script>
